name: Deploy to Azure Container Apps

on:
  workflow_dispatch:

# Container Apps deployment — run manually when that infrastructure is provisioned.

env:
  AZURE_RESOURCE_GROUP: rg-aprimo-dam-mcp
  ACR_NAME: acraprimodammcp
  CONTAINER_APP_NAME: aprimo-dam-mcp
  IMAGE_NAME: aprimo-dam-mcp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name ${{ env.ACR_NAME }} --query loginServer -o tsv)
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:$IMAGE_TAG \
                       -t $ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:latest .
          docker push $ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:$IMAGE_TAG
          docker push $ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:latest
          echo "IMAGE=$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }}

      - name: Show deployment URL
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "MCP endpoint: https://$FQDN/mcp"
          echo "Health check: https://$FQDN/health"
